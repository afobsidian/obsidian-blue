name: Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/validate-recipe.sh
      - run: bash tests/test-sudo-boot-cleanup.sh
      - run: bash tests/test-first-login-setup.sh
      - run: bash tests/test-rpmfusion-bootstrap.sh
      - run: bash tests/test-openapv-compat.sh
      - run: bash tests/test-omarchy-browser-launcher.sh
      - run: bash tests/test-omarchy-menu.sh
      - run: bash tests/test-quattro-migration.sh
      - run: bash tests/test-yt6801-migration.sh
      - run: bash tests/test-owe-migration.sh
