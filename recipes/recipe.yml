name: obsidian-blue
description: Omarchy Quattro on Fedora Atomic with a mutable user configuration layer.

base-image: quay.io/fedora/fedora-bootc
image-version: rawhide

modules:
  - type: script
    scripts:
      - enable-rpmfusion-free.sh

  - type: dnf
    repos:
      cleanup: true
      files:
        - lionheartp-hyprland.repo
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        - hyprland
        - hyprland-devel
        - hyprland-uwsm
        - uwsm
        - quickshell
        - qt6-qtimageformats
        - hypridle
        - hyprlock
        - hyprpicker
        - hyprpolkitagent
        - hyprsunset
        - hyprland-guiutils
        - hyprland-qt-support
        - xdg-desktop-portal-hyprland

  - type: script
    scripts:
      - install-openapv-compat.sh

  - type: dnf
    repos:
      cleanup: true
      files:
        - jdxcode-mise.repo
        - starship.repo
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        - NetworkManager
        - NetworkManager-wifi
        - wpa_supplicant
        - iwlwifi-mvm-firmware
        - iwlwifi-dvm-firmware
        - iwlbluetooth-firmware
        - alsa-sof-firmware
        - flatpak
        - polkit
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - pipewire
        - pipewire-pulseaudio
        - pipewire-alsa
        - openssh-clients
        - openssh-server
        - xorg-x11-server-Xwayland
        - hicolor-icon-theme
        - adwaita-icon-theme
        - ImageMagick
        - NetworkManager-tui
        - alacritty
        - alsa-utils
        - avahi
        - bash-completion
        - bat
        - bluez
        - bluez-tools
        - bolt
        - brightnessctl
        - btop
        - chromium
        - clang
        - cmake
        - gcc-c++
        - libdrm-devel
        - libinput-devel
        - libxkbcommon-devel
        - make
        - pixman-devel
        - pkgconf-pkg-config
        - systemd-devel
        - wayland-devel
        - cups
        - cups-filters
        - cups-pk-helper
        - curl
        - libcurl.x86_64
        - dbus-tools
        - ddcutil
        - dosfstools
        - distrobox
        - evince
        - exfatprogs
        - eza
        - fastfetch
        - fcitx5
        - fcitx5-configtool
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-gtk
        - fcitx5-hangul
        - fcitx5-mozc
        - fcitx5-qt
        - fd-find
        - ffmpeg
        - ffmpeg-devel
        - ffmpegthumbnailer
        - foot
        - fzf
        - fwupd
        - fwupd-efi
        - gh
        - git
        - gnome-disk-utility
        - glibc-langpack-en
        - gnome-keyring
        - adw-gtk3-theme
        - google-noto-color-emoji-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-fonts
        - grim
        - gum
        - gvfs-mtp
        - gvfs-nfs
        - gvfs-smb
        - imv
        - hostname
        - iputils
        - traceroute
        - inotify-tools
        - inxi
        - intel-vpl-gpu-rt
        - iwd
        - jq
        - kitty
        - less
        - libsecret
        - libva-intel-media-driver
        - libvpl
        - libxkbcommon-utils
        - lua
        - luarocks
        - man-db
        - mise
        - mpv
        - nautilus
        - nautilus-python
        - neovim
        - nmap-ncat
        - pamixer
        - pciutils
        - perf
        - perl-JSON-PP
        - playerctl
        - plocate
        - plymouth
        - plymouth-plugin-script
        - plymouth-plugin-label
        - podman
        - podman-compose
        - podman-docker
        - podman-tui
        - power-profiles-daemon
        - python3-gobject
        - qrencode
        - qt6-qtbase-devel
        - qt6-qtdeclarative-devel
        - qt6-qtmultimedia-devel
        - qt6-qtsvg-devel
        - qt6-qtwayland-devel
        - ripgrep
        - ruby
        - sddm
        - slurp
        - socat
        - starship
        - sushi
        - sysprof
        - system-config-printer
        - tailscale
        - tesseract
        - tesseract-langpack-eng
        - tldr
        - tmux
        - udiskie
        - unzip
        - upower
        - usbutils
        - whois
        - wireplumber
        - wl-clipboard
        - wtype
        - xdg-desktop-portal-gtk
        - xdg-terminal-exec
        - xdg-user-dirs
        - xdg-utils
        - xsetroot
        - yaru-icon-theme
        - yq
        - yt-dlp
        - zbar
        - zoxide
        - zsh
    remove:
      packages:
        - curl-minimal
        - cups-browsed
        - cups-pdf
        - kvantum
        - kvantum-qt5
        - Thunar
        - thunar-archive-plugin
        - thunar-volman
        - tuned-ppd
        - wlsunset

  - type: script
    scripts:
      - install-omarchy-apps.sh

  - type: brew
    brew-analytics: false

  - type: os-release
    properties:
      NAME: obsidian-blue
      ID_LIKE: fedora
      PRETTY_NAME: Obsidian Blue (powered by Fedora Atomic)
      CPE_NAME: cpe:/o:afobsidian:obsidian-blue
      DEFAULT_HOSTNAME: obsidian-blue
      HOME_URL: https://github.com/afobsidian/obsidian-blue
      DOCUMENTATION_URL: https://github.com/afobsidian/obsidian-blue
      SUPPORT_URL: https://github.com/afobsidian/obsidian-blue/issues
      BUG_REPORT_URL: https://github.com/afobsidian/obsidian-blue/issues
      VARIANT: Omarchy Quattro
      VARIANT_ID: obsidian-blue
      IMAGE_ID: obsidian-blue

  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  - type: script
    scripts:
      - install-omarchy-quattro.sh
      - install-omarchy-titlebars.sh
      - install-omarchy-nvim.sh
      - setup-image-config.sh
      - install-rustle.sh
      - rebuild-desktop-initramfs.sh
      - validate-omarchy-image.sh

  - type: systemd
    system:
      enabled:
        - NetworkManager.service
        - avahi-daemon.service
        - bluetooth.service
        - cups.service
        - podman.socket
        - sddm.service
        - tailscaled.service
      masked:
        - greetd.service
        - systemd-remount-fs.service
    user:
      enabled:
        - podman.socket
        - rustle.service
        - owed.service
        - omarchy-migrate-notify.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        install:
          - com.github.xournalpp.xournalpp
          - com.obsproject.Studio
          - io.podman_desktop.PodmanDesktop
          - org.kde.kdenlive
          - org.localsend.localsend_app

  - type: signing
