name: obsidian-blue
description: Omarchy Quattro on Fedora Atomic with a mutable user configuration layer.

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest

modules:
  - type: script
    scripts:
      - clear-rpmfusion-dnf-cache.sh
      - swap-hyprland-copr.sh

  - type: dnf
    repos:
      cleanup: true
      files:
        - lionheartp-hyprland.repo
    remove:
      auto-remove: false
      packages:
        - hyprland
        - hyprland-git
        - hyprland-plugins
        - hyprland-plugins-git
        - waybar
        - waybar-git
        - dunst
        - mako
        - greetd
        - gtkgreet
    install:
      allow-erasing: true
      install-weak-deps: false
      packages:
        - hyprland
        - hyprland-uwsm
        - uwsm
        - quickshell
        - hypridle
        - hyprpicker
        - hyprpolkitagent
        - hyprsunset
        - hyprland-guiutils
        - hyprland-qt-support
        - xdg-desktop-portal-hyprland

  - type: dnf
    repos:
      cleanup: true
      files:
        - jdxcode-mise.repo
        - starship.repo
    install:
      skip-unavailable: true
      skip-broken: true
      install-weak-deps: false
      packages:
        - ImageMagick
        - NetworkManager-tui
        - alacritty
        - alsa-utils
        - avahi
        - bash-completion
        - bat
        - bluez
        - bluez-tools
        - bolt
        - brightnessctl
        - btop
        - chromium
        - clang
        - cups
        - cups-browsed
        - cups-filters
        - cups-pdf
        - dbus-tools
        - ddcutil
        - dosfstools
        - dua-cli
        - evince
        - exfatprogs
        - eza
        - fastfetch
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - fd-find
        - ffmpeg-free
        - ffmpegthumbnailer
        - foot
        - fzf
        - gh
        - git
        - gnome-disk-utility
        - gnome-keyring
        - gnome-themes-extra
        - google-noto-color-emoji-fonts
        - google-noto-sans-cjk-fonts
        - grim
        - gum
        - gvfs-mtp
        - gvfs-nfs
        - gvfs-smb
        - imv
        - inetutils
        - inotify-tools
        - inxi
        - iwd
        - jq
        - kitty
        - less
        - libsecret
        - libxkbcommon-utils
        - lua
        - luarocks
        - man-db
        - mise
        - mpv
        - nautilus
        - nautilus-python
        - neovim
        - nmap-ncat
        - pamixer
        - perf
        - perl-JSON-PP
        - playerctl
        - plocate
        - plymouth
        - podman
        - podman-compose
        - podman-docker
        - podman-tui
        - power-profiles-daemon
        - python3-gobject
        - qrencode
        - ripgrep
        - ruby
        - sddm
        - slurp
        - socat
        - starship
        - sushi
        - sysprof
        - system-config-printer
        - tailscale
        - tesseract
        - tesseract-langpack-eng
        - tldr
        - tmux
        - udiskie
        - unzip
        - usbutils
        - whois
        - wireplumber
        - wl-clipboard
        - wtype
        - xdg-desktop-portal-gtk
        - xdg-terminal-exec
        - xdg-user-dirs
        - xdg-utils
        - yaru-icon-theme
        - yq
        - yt-dlp
        - zbar
        - zoxide
        - zsh
    remove:
      packages:
        - Thunar
        - thunar-archive-plugin
        - thunar-volman
        - tuned-ppd
        - wlsunset

  - type: brew
    brew-analytics: false

  - type: os-release
    properties:
      NAME: obsidian-blue
      ID_LIKE: fedora
      PRETTY_NAME: Obsidian Blue (powered by Fedora Atomic)
      CPE_NAME: cpe:/o:afobsidian:obsidian-blue
      DEFAULT_HOSTNAME: obsidian-blue
      HOME_URL: https://github.com/afobsidian/obsidian-blue
      DOCUMENTATION_URL: https://github.com/afobsidian/obsidian-blue
      SUPPORT_URL: https://github.com/afobsidian/obsidian-blue/issues
      BUG_REPORT_URL: https://github.com/afobsidian/obsidian-blue/issues
      VARIANT: Omarchy Quattro
      VARIANT_ID: obsidian-blue
      IMAGE_ID: obsidian-blue

  - type: files
    files:
      - source: usr
        destination: /usr
      - source: etc
        destination: /etc

  - type: script
    scripts:
      - install-omarchy-quattro.sh
      - install-omarchy-nvim.sh
      - setup-image-config.sh
      - validate-omarchy-image.sh

  - type: systemd
    system:
      enabled:
        - NetworkManager.service
        - avahi-daemon.service
        - bluetooth.service
        - cups.service
        - podman.socket
        - sddm.service
        - tailscaled.service
      masked:
        - greetd.service
        - systemd-remount-fs.service
    user:
      enabled:
        - podman.socket

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        install:
          - com.github.PintaProject.Pinta
          - com.github.xournalpp.xournalpp
          - com.moonlight_stream.Moonlight
          - com.obsproject.Studio
          - io.podman_desktop.PodmanDesktop
          - md.obsidian.Obsidian
          - org.kde.kdenlive
          - org.libreoffice.LibreOffice
          - org.localsend.localsend_app

  - type: signing
