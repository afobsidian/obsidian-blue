-- Minimal Hyprland Lua config for the SDDM Wayland greeter.

hl.monitor({ output = "", mode = "preferred", position = "auto", scale = 1 })

hl.on("hyprland.start", function()
  hl.exec_cmd("/usr/libexec/obsidian-blue-sddm-display-setup")
end)

hl.window_rule({
  match = { class = "^(sddm-greeter.*)$" },
  fullscreen = true,
})

hl.window_rule({
  match = { class = "^(sddm-greeter.*)$" },
  stay_focused = true,
})

hl.config({
  misc = {
    disable_hyprland_logo = true,
    disable_splash_rendering = true,
    force_default_wallpaper = 0,
  },
})
